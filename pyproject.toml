[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbr-unified-statistics"
version = "0.1.0"
description = "Lossless, provenance-aware unification of the registry-defined Bank of Russia Excel statistics universe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "openpyxl>=3.1",
  "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cbr-unified = "cbr_unified.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
