name: CBR source-universe probe

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/research/probe_sources.py"
      - ".github/workflows/source-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Acquire and inspect complete registry universe
        shell: bash
        run: |
          set +e
          python tools/research/probe_sources.py _mw/research/evidence/source-probe
          probe_status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _mw/research/evidence/source-probe
          if ! git diff --cached --quiet; then
            git commit -m "Record CBR source-universe probe evidence [skip ci]"
            git push
          fi

          exit "$probe_status"
