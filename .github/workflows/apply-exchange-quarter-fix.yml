name: Apply exchange quarter presentation fix

on:
  push:
    paths:
      - '.github/workflows/apply-exchange-quarter-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact quarterly abbreviation grammar
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/cbr_unified/semantic.py')
          text = path.read_text(encoding='utf-8')
          old = '(?:кв(?:артал)?|q)'
          new = '(?:кв(?:арт(?:ал)?)?|q)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one semantic quarter grammar occurrence, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit exact repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cbr_unified/semantic.py
          git commit -m 'Accept CBR quarterly abbreviation in exchange-rate parser'
          git push
