name: Product verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Unit and integration tests
        run: pytest

  full-build:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Live build and offline deterministic replay
        run: python tools/verify_full_build.py _verification
      - name: Independent OOXML preservation verification
        run: python tools/independent_verify_preservation.py _verification/live
      - name: Upload verification and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbr-unified-verification
          include-hidden-files: true
          path: |
            _verification/full-build-report.json
            _verification/independent-preservation-report.json
            _verification/.live.staging-*/failure.json
            _verification/.live.staging-*/source_manifest.acquisition.json
            _verification/.live.staging-*/failure-evidence/*.csv
          if-no-files-found: warn
