name: Build CBR research pack

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/research/build_research_pack.py"
      - ".github/workflows/research-pack.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build readable research evidence
        run: python tools/research/build_research_pack.py
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _mw/research/evidence/research-pack
          if ! git diff --cached --quiet; then
            git commit -m "Build human-readable CBR research pack [skip ci]"
            git push
          fi
